<!doctype html>
<html lang="ko" data-season="winter" data-brand="momo">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>모모의 여행 상담소</title>
<meta name="description" content="우체부 철새 모모가 운영시간·휴무일까지 확인한 국내 여행 일정을 엽서처럼 배달해 드려요.">
<meta name="color-scheme" content="light dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<link rel="stylesheet" href="/static/tokens.css">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<a class="skip" href="#q">입력창으로 건너뛰기</a>
<div class="app">
  <section class="convo" aria-label="모모와의 상담">
    <header class="desk-bar">
      <div id="desk" class="desk" data-mood="idle"></div>
      <div class="desk-title">
        <h1 class="display">모모의 여행 상담소</h1>
        <p class="desk-sub">경주 · 순천/구례 · 수원 — 운영시간·휴무일까지 확인해요</p>
        <p id="mood-line" class="mood-line" aria-live="polite">편지를 기다리고 있어요</p>
      </div>
      <nav class="desk-nav" aria-label="계획 관리">
        <button type="button" class="btn sm ghost" data-act="trips-open" aria-haspopup="dialog">내 여행 계획</button>
        <button type="button" class="btn sm ghost" data-act="new-chat">새 상담</button>
      </nav>
      <div class="airmail" aria-hidden="true"></div>
    </header>

    <div class="m-condbar">
      <button type="button" class="m-toggle" data-act="m-cond" aria-expanded="false" aria-controls="m-cond-slot">
        <span class="m-t">여행 조건</span><span id="m-cond-sum" class="sum"></span>
        <svg class="ico chev" aria-hidden="true" focusable="false"><use href="#ico-chev"/></svg>
      </button>
      <div class="m-prog-wrap"><div class="prog compact" id="m-prog"><div class="prog-top"><span class="prog-l"></span><span class="prog-n"></span></div>
        <div class="prog-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-label="여행 조건 확정 진행률"><span class="prog-fill"></span></div></div></div>
      <div id="m-cond-slot" class="m-body" hidden></div>
    </div>

    <div id="scroller" class="scroller">
      <div id="thread" class="thread" aria-live="polite" aria-relevant="additions">
        <div id="brochure" class="brochure" hidden></div>
      </div>
    </div>

    <form id="composer" class="composer" autocomplete="off">
      <div class="composer-row">
        <button type="button" id="mic" class="mic" aria-label="음성으로 입력" aria-pressed="false" hidden><svg class="mic-ico" aria-hidden="true" focusable="false"><use href="#ico-mic"/></svg></button>
        <label class="sr" for="q">모모에게 보낼 말</label>
        <textarea id="q" rows="1" placeholder="모모에게 편지 쓰기…"></textarea>
        <button id="send" class="send" type="submit"><span>보내기</span><svg class="ico" aria-hidden="true" focusable="false"><use href="#ico-send"/></svg></button>
      </div>
      <p id="mic-note" class="mic-note" hidden></p>
    </form>
  </section>

  <div id="split" class="split" role="separator" aria-orientation="vertical" aria-label="상담 영역과 정보창 폭 조절" aria-valuemin="0" aria-valuemax="100" aria-valuenow="62" tabindex="0" title="끌어서 폭 조절 · 두 번 누르면 기본값"><span class="grip" aria-hidden="true"></span></div>
  <aside id="side" class="side" aria-label="여행 정보">
    <section id="cond-panel" class="panel cond-panel" aria-label="여행 조건"></section>
    <section id="cost-panel" class="panel cost-panel" aria-label="예상 경비" hidden></section>
    <section id="pack-panel" class="panel pack-panel" aria-label="준비물" hidden></section>
    <section id="map-panel" class="panel map-panel" aria-label="지도">
      <div id="map-tabs" class="map-tabs" role="tablist" aria-label="날짜별 지도"></div>
      <div class="map-box">
        <div id="map" class="map" aria-label="방문 순서 지도"></div>
        <div id="map-empty" class="map-empty"><svg class="bird big" aria-hidden="true" focusable="false"><use href="#momo-bird"/></svg><p>계획서가 나오면 여기에 날짜별 동선을 그려 드릴게요.</p></div>
      </div>
      <p id="map-sum" class="map-sum"></p>
      <p class="legend">점선은 방문 순서(직선)예요. 실제 도로와 다를 수 있어요.</p>
    </section>
    <section id="act-panel" class="panel act-panel" aria-label="합계와 확정" hidden></section>
  </aside>
</div>

<dialog id="trips" class="drawer" aria-labelledby="trips-h">
  <div class="drawer-h">
    <h2 id="trips-h" class="display">내 여행 계획</h2>
    <button type="button" class="btn sm ghost" data-act="new-chat">새 여행 상담</button>
    <button type="button" class="x" data-act="trips-close" aria-label="닫기">×</button>
  </div>
  <div id="trips-body" class="drawer-b"></div>
</dialog>

<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script src="/static/app.js"></script>
</body>
</html>
