<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>모모의 여행 상담소</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header><h1>✉ 모모의 여행 상담소</h1><p>우체부 철새 모모가 운영시간·휴무일까지 확인한 국내 여행 일정을 짜 드려요 (경주 · 순천/구례 · 수원)</p></header>
<main>
  <div id="log"><div class="msg momo">안녕하세요, 우체부 철새 모모예요! 가고 싶은 지역, 날짜, 함께 가는 분을 알려 주세요.
예) 12월 12일 토요일에 아이 둘이랑 경주 1박 2일 가요. 서울에서 차로 출발해요</div></div>
  <div id="plan"></div>
  <div class="actions" id="actions"></div>
</main>
<form id="f">
  <button type="button" id="mic" class="mic" aria-label="음성으로 입력" aria-pressed="false" hidden>🎤</button>
  <textarea id="q" placeholder="모모에게 편지 쓰기… (마이크로 말해도 돼요)"></textarea><button>보내기</button>
  <p id="mic-note" class="mic-note" hidden></p>
</form>
<script src="/static/cards.js"></script>
<script>
let sessionId = null, draftVersion = null;
const log = document.getElementById("log"), planEl = document.getElementById("plan"), actions = document.getElementById("actions");
function say(text, who) { const d = document.createElement("div"); d.className = "msg " + who; d.textContent = text; log.appendChild(d); d.scrollIntoView({block: "end"}); return d; }
async function send(body) {
  if (body.question) say(body.question, "me");
  const wait = say("모모가 날아가서 알아보는 중이에요…", "momo");
  try {
    const r = await fetch("/query", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ ...body, session_id: sessionId, draft_version: draftVersion }) });
    const j = await r.json();
    wait.remove();
    sessionId = j.session_id || sessionId;
    say(j.answer, "momo");
    actions.innerHTML = "";
    if (j.chips) { const c = document.createElement("div"); c.className = "chips";
      j.chips.forEach(t => { const b = document.createElement("button"); b.type = "button"; b.textContent = t;
        b.onclick = () => send({ question: t }); c.appendChild(b); }); log.appendChild(c); }
    if (j.itinerary && j.itinerary.length) renderItinerary(planEl, j.itinerary);
    if (j.status === "승인 대기") {
      draftVersion = j.draft_version || draftVersion;
      const b = document.createElement("button"); b.className = "primary"; b.type = "button"; b.textContent = "확정할게요";
      b.onclick = () => send({ question: "", action: "approve" }); actions.appendChild(b);
    }
    if (j.status === "확정") {
      actions.innerHTML = `<a href="${j.share_url}" target="_blank">공유 링크 열기</a><a href="${j.ics_url}">캘린더(.ics) 받기</a>`;
    }
  } catch (e) { wait.textContent = "앗, 연결이 끊겼어요. 다시 보내 주실래요?"; }
}
// 음성 입력: 브라우저 내장 음성 인식(Web Speech API). 인식 결과는 입력창에만 채우고, 보내기는 사용자가 확인 후 누름
(function voice() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const mic = document.getElementById("mic"), note = document.getElementById("mic-note"), q = document.getElementById("q");
  if (!SR) {
    note.textContent = "이 브라우저는 음성 인식을 지원하지 않아요. 휴대폰 키보드의 마이크(받아쓰기)를 써 주세요.";
    note.hidden = false;
    return;
  }
  mic.hidden = false;
  let rec = null, base = "";
  const stop = () => { if (rec) rec.stop(); };
  mic.onclick = () => {
    if (rec) { stop(); return; }
    rec = new SR();
    rec.lang = "ko-KR"; rec.interimResults = true; rec.continuous = false;
    base = q.value ? q.value.trim() + " " : "";
    rec.onresult = e => {
      let text = "";
      for (const r of e.results) text += r[0].transcript;
      q.value = base + text;
    };
    rec.onerror = e => {
      note.textContent = e.error === "not-allowed" || e.error === "service-not-allowed"
        ? "마이크 권한이 꺼져 있어요. 브라우저 설정에서 마이크를 허용해 주세요(휴대폰은 https 주소에서만 돼요)."
        : "잘 못 들었어요. 마이크를 다시 눌러 말씀해 주세요.";
      note.hidden = false;
    };
    rec.onend = () => { rec = null; mic.classList.remove("on"); mic.setAttribute("aria-pressed", "false");
      if (q.value.trim()) { note.textContent = "받아 적은 내용을 확인하고 '보내기'를 눌러 주세요."; note.hidden = false; q.focus(); } };
    mic.classList.add("on"); mic.setAttribute("aria-pressed", "true");
    note.textContent = "듣고 있어요… 말씀이 끝나면 자동으로 멈춰요. (음성은 브라우저의 음성 인식 서비스에서 글자로 바뀌어요)";
    note.hidden = false;
    rec.start();
  };
})();
document.getElementById("f").onsubmit = e => { e.preventDefault(); const q = document.getElementById("q"); if (!q.value.trim()) return; send({ question: q.value.trim() }); q.value = ""; };
</script>
</body>
</html>
