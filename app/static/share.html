<!doctype html>
<html lang="ko" data-season="winter">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>__TITLE__ · 모모의 여행 상담소</title>
<meta name="color-scheme" content="light dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<link rel="stylesheet" href="/static/style.css">
</head>
<body class="read-only">
<div class="app">
  <section class="convo" aria-label="여행 계획서">
    <header class="desk-bar share-bar">
      <div class="desk mini"><svg class="bird" aria-hidden="true" focusable="false"><use href="#momo-bird"/></svg></div>
      <div class="desk-title">
        <h1 class="display">__TITLE__</h1>
        <p class="desk-sub" id="share-sub">모모의 여행 상담소가 배달한 확정 계획서 · 읽기 전용</p>
      </div>
      <nav class="desk-nav noprint" aria-label="바로가기">
        <a class="btn sm ghost" href="/">나도 상담하기</a>
      </nav>
      <div class="airmail" aria-hidden="true"></div>
    </header>

    <div class="m-condbar">
      <button type="button" class="m-toggle" data-act="m-cond" aria-expanded="false" aria-controls="m-cond-slot">
        <span class="m-t">여행 조건</span><span id="m-cond-sum" class="sum"></span>
        <svg class="ico chev" aria-hidden="true" focusable="false"><use href="#ico-chev"/></svg>
      </button>
      <div id="m-cond-slot" class="m-body" hidden></div>
    </div>

    <div id="scroller" class="scroller">
      <div id="thread" class="thread">
        <div id="brochure" class="brochure" hidden></div>
        <section id="expenses" class="expenses" aria-labelledby="exp-h" hidden></section>
      </div>
    </div>
  </section>

  <div id="split" class="split" role="separator" aria-orientation="vertical" aria-label="상담 영역과 정보창 폭 조절" aria-valuemin="0" aria-valuemax="100" aria-valuenow="62" tabindex="0" title="끌어서 폭 조절 · 두 번 누르면 기본값"><span class="grip" aria-hidden="true"></span></div>
  <aside id="side" class="side" aria-label="여행 정보">
    <section id="cond-panel" class="panel cond-panel" aria-label="여행 조건"></section>
    <section id="cost-panel" class="panel cost-panel" aria-label="예상 경비" hidden></section>
    <section id="pack-panel" class="panel pack-panel" aria-label="준비물" hidden></section>
    <section id="map-panel" class="panel map-panel" aria-label="지도">
      <div id="map-tabs" class="map-tabs" role="tablist" aria-label="날짜별 지도"></div>
      <div class="map-box">
        <div id="map" class="map" aria-label="방문 순서 지도"></div>
        <div id="map-empty" class="map-empty" hidden><p>지도에 그릴 일정이 없어요.</p></div>
      </div>
      <p id="map-sum" class="map-sum"></p>
      <p class="legend">점선은 방문 순서(직선)예요. 실제 도로와 다를 수 있어요.</p>
    </section>
    <section id="act-panel" class="panel act-panel" aria-label="내려받기" hidden></section>
  </aside>
</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>(function(){ try { var b = __DATA__; if (b && b.view && !b.plan_id) { document.addEventListener("DOMContentLoaded", function(){ var s = document.getElementById("share-sub"); if (s) s.textContent = "모모의 여행 상담소가 배달한 계획서 초안 · 읽기 전용"; }); } } catch (e) {} })();</script>
<script>window.MOMO_BOOT = { readOnly: true, planId: "__PLAN_ID__", payload: __DATA__ };</script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script src="/static/app.js"></script>
</body>
</html>
