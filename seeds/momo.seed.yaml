ontology_schema:
  name: MomoTripPlan
  description: A grounded, rule-checked domestic trip plan made through conversation with 모모, including
    its status lifecycle and exports.
  fields:
  - name: session_id
    type: string
    description: Multi-turn session key
    required: true
  - name: status
    type: string
    description: 완료/되묻기/거절/승인 대기/확정/정보/오류
    required: true
  - name: conditions
    type: object
    description: Pydantic-structured region, date, length, departure, preferences, defaults applied
    required: true
  - name: answer
    type: string
    description: Natural-language reply in 모모's voice
    required: true
  - name: itinerary
    type: array
    description: Items with seq, date, type, place_id, place_name, start/end time, travel minutes/source/mode,
      reason, source, hours_status, lat/lng, image_url, image_license, summary
    required: true
  - name: contexts
    type: array
    description: 'Guide standard: [{doc_id, text}]; doc_id is the TourAPI contentid (overseas: osm:{id})'
    required: true
  - name: trace
    type: array
    description: 'Guide standard: [{step, input, output}]; tool calls, rule violations, regeneration count and per-leg travel source are recorded as steps (PII masked)'
    required: true
  - name: theme
    type: object
    description: Season, domestic/overseas, weather
    required: true
  - name: draft_version
    type: string
    description: Hash of the current draft; approve must match it
    required: false
  - name: plan_id
    type: string
    description: Random token for a confirmed plan (only when status=확정)
    required: false
  - name: share_url
    type: string
    description: /plan/{plan_id} (only when status=확정)
    required: false
  - name: ics_url
    type: string
    description: /plan/{plan_id}.ics (only when status=확정)
    required: false
evaluation_principles:
- name: rule_compliance
  description: Zero hard-gate violations on time, hours, closures, windows, places and sources
  weight: 1.0
- name: groundedness
  description: Every recommendation and summary is traceable to TourAPI data or cache
  weight: 0.9
- name: guardrail_safety
  description: PII masked, injection refused, no unapproved save or share
  weight: 1.0
- name: eval_integrity
  description: Frozen scoring setup, reproducible runs with no live routing calls
  weight: 0.8
- name: user_experience
  description: Readable responsive itinerary with images, summaries and 모모's tone
  weight: 0.6
exit_conditions:
- name: targets_met
  description: Round 2 meets targets and all MUST checks pass
  criteria: round2 passed ≥ 17/20, guardrail 3/3, separate .ics/share/waypoint/UI tests pass
- name: deadline
  description: Submission deadline reached
  criteria: Day 10 15:00; feature freeze after Day 10 10:00
