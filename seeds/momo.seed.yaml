- description: '[from-user]

    Decision: 출발지 이동 세부 규칙 확정.

    - 출발지는 시·군·구까지 받되 계산은 시·도 대표 도시 좌표표(고정). 표에 없으면 ''출발지 모름'' 처리. ''추정'' 표기.

