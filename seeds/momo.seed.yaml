- description: '[from-user]

    Decision: 옵션 A — 핵심 한 줄기 + 컷라인.


    필수(MUST):

    - 대상 3개 지역 데이터(경주 먼저 수집·검증, 이어서 순천/구례·수원). 지역은 코드에 박지 않고 데이터 파라미터로.

    - 조건 구조화(Pydantic) → RAG 검색 → 일정 생성 → 규칙 검사(휴무일·운영시간 밖·시간 겹침·없는 장소; 위반 시 재생성 최대 2회) → POST /query(answer/contexts/trace,
    session_id).

    - 가드레일(입력 PII·인젝션, 출력 근거 검사), 확정 승인(HITL), 대화 이어서 수정(멀티턴).

    - 자동 평가: test_queries.csv 20건 + RAGAS → round1 리포트.

    - 테마 없는 기본 단일 페이지 화면.


    추가(NICE, 우선순위 순): 1) 계절·국내/해외·날씨 테마 UI 2) 해외 가벼운 모드 3) 장기 메모리 4) LifeGalaxy add-on 5) MCP.


    컷라인: Day 9 18:00까지 1차 평가가 끝나지 않으면 추가 기능 착수 안 함. Day 10 10:00 이후 새 기능 동결(개선·2차 평가·README만).


    참고(main session 확인): 테스트 케이스 #16(해외), #17(add-on)은 NICE 의존 → 미구현 시 2건 실패, 85% 목표(최대 3건 실패) 안에서 허용.'
