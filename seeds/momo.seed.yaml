goal: Build "모모의 여행 상담소", an Agentic RAG travel agent for the Samsung SDS AX mini PJT, finished by Day
  10 15:00. The postman migratory-bird character 모모 talks with the user like a counselor and builds a
  당일~1박 2일 domestic trip for 경주, 순천/구례 or 수원. Each trip is grounded in 한국관광공사 TourAPI data and accounts
  for 휴무일, 운영시간, 축제, 날씨 and travel time from the departure city, with 0 rule violations; user-specified
  waypoints are included. The trip is shown as a detailed itinerary that works on PC and mobile, with
  a representative image and a summary for each place. After the user approves it, the trip is confirmed
  and exported as .ics and a share link; LifeGalaxy trip JSON v1 is an add-on option. The service is POST
  /query plus a single page served by FastAPI, and it must pass 17 of the 20 in-out test cases in round
  2 (85%) with guardrail cases at 100%. Matching the plan against actual photos is a NICE feature, and
  the agent will be integrated into LifeGalaxy after submission.
task_type: code
brownfield_context:
  project_type: greenfield
  context_references: []
  existing_patterns: []
  existing_dependencies: []
constraints:
- 'Stack: AWS Bedrock Claude Sonnet 4.5 (generation), Titan Embeddings v2, Chroma, BM25 + kiwipiepy, LangGraph,
  LangSmith; data from 한국관광공사 TourAPI (collected in advance), Open-Meteo, OSRM, OSM'
- 'Required patterns: LCEL+Pydantic, RAG, Trace, evaluation (RAGAS + LLM-as-Judge), plus at least 6 of
  ReAct, multiple tools, guardrails, HITL, middleware, Plan-Execute (long-term memory is NICE); Multi-Agent
  excluded'
- Target regions are 경주, 순천/구례 (one area) and 수원, passed as data parameters rather than hardcoded; other
  domestic regions get a '준비 안 된 지역' message; overseas is a NICE 가벼운 모드 (theme, weather and OSM basics
  only, answer must contain '가벼운 모드')
- Trip length is 당일 to 1박 2일; '당일', '당일치기', '하루 코스' and '데이트립' mean 당일 and override the default; longer
  requests get a message proposing 1박 2일
- 'API: POST /query {question, optional session_id, optional action} returns {answer, contexts, trace,
  status, theme, session_id, itinerary}; answer is a string in 모모''s voice that states place names, dates,
  start and end times, travel time, reasons and sources; itinerary is a separate array built first; answer
  and itinerary are checked for consistency'
- 'itinerary item fields: seq, date (YYYY-MM-DD), type (place/meal/stay/move), place_id (TourAPI contentid),
  place_name, start_time/end_time (HH:MM, 24h), travel_minutes_from_prev (0 for the first item), transport_mode,
  transport_mode (car/walk/transit), travel_source (cache/estimate), reason, source, hours_status (확인됨/확인 필요/휴무/해외), lat/lng, image_url,
  image_license, summary'
- 'status values: 완료, 되묻기, 거절, 승인 대기, 확정, 정보, 오류'
- Missing region gives status=되묻기 once, as chip choices that also ask for any other missing conditions;
  a missing date defaults to the nearest Saturday and a missing length to 1박 2일, with '기본값 적용' stated
  in the answer
- 'No OSRM calls while the agent runs or is evaluated: local travel times come from a committed OSRM cache
  (key from_id|to_id|mode); on a cache miss use straight-line distance × 1.3 ÷ speed (car 30 km/h, walking
  4.5 km/h) with a minimum of 5 minutes; estimates never fail a plan, but the answer says that some times
  are estimated and the trace records the source of each leg'
- 'Time overlap rule: previous item end + travel time + 10-minute buffer > next item start is a violation'
- 'Departure travel: the departure is taken at 시·군·구 level and resolved through a fixed table of representative-city
  coordinates for all 17 시·도; the reference point is the centroid of the region''s collected places; city-to-city
  time is straight-line distance × 1.3 ÷ 80 km/h; default departure is 08:00 unless the user gives a time;
  the trip starts and ends with type=move items (travel_source=estimate, no place_id); trains and buses
  use the same estimate with a note that transit times are estimated; departing from 제주 gets a note to
  check flight times'
- 'Local time window: start = max(09:00, departure + one-way + 10 min) and end = min(20:00, 22:00 − one-way);
  for 1박 2일 this applies only to day 1 start and day 2 end; for 당일, under 1 h available gives status=정보
  with no plan, 1–3 h gives a plan plus a warning, and 1박 2일 never warns; if the departure is unknown,
  use 09–20 local time and say travel time is excluded'
- 'Meals: one lunch (12–14) and one dinner (18–20) are required only when the slot overlaps the local
  window by at least 30 minutes; if no restaurant with confirmed hours fits, add a ''주변에서 식사'' item (type=meal,
  no place_id, source=''식사 안내'')'
- A 1박 trip must end day 1 with a type=stay item; only the check-in time is checked
- 'hours_status ''확인 필요'' is a warning, not a violation: it gets a badge, a lower rank, at most one per
  day, and is never placed at a meal or the last slot; festivals are checked against eventstartdate~eventenddate'
- 'Data collection per region: about 30 attractions and cultural facilities, 20 restaurants, 10 lodgings
  and up to 10 festivals, managed in a config table and kept within TourAPI''s daily limit; detailCommon2
  adds firstimage, overview and cpyrhtDivCd; place summaries (2–3 sentences) are generated and cached
  at collection time, checked once against the overview by a Judge (Sonnet 4.6), regenerated on failure,
  and after 2 failures replaced by a quote from the start of the overview'
- Images are TourAPI firstimage links (not copied into the repo) with source and 공공누리 type shown; 제3유형
  images must not be cropped or altered; places without an image show a 모모 illustration
- 'Guardrails: (1) no ungrounded information, and AI-recommended places must exist in retrieved data (user-specified
  waypoints are exempt); (2) PII masking, with an opt-in exception only for a home location registered
  in settings; (3) no save or share without HITL approval; (4) refuse out-of-scope requests and prompt
  injection; (5) source display: every item has a source, domestic answers (including informational ones)
  contain ''한국관광공사'', overseas answers contain ''가벼운 모드''; ads are out of MVP scope'
- A plan is generated, rule-checked, and regenerated at most 2 times when a violation is found
- Approval only through POST /query action='approve' + session_id (the '확정할게요' button); chat text never
  saves anything; the 확정 response includes plan_id (a random, unguessable token), share_url /plan/{plan_id}
  and ics_url /plan/{plan_id}.ics; a modification request during 승인 대기 goes back to generation; long-term
  memory and LifeGalaxy saving need separate explicit actions
- The share page GET /plan/{plan_id} is read-only, stored in SQLite, never expires, and shows departure
  only at 시·도 level
- 'User-specified waypoints (''OO 들러 줘'') are MUST: a place in the collected data is inserted with its
  data and rule-checked; a place outside it becomes source=''사용자 지정'' with hours_status=확인 필요, the user
  is asked for the stay time, and its location comes from one OSM lookup (on failure, the location is
  unknown and travel time is ''확인 필요'')'
- 'Scoring setup is frozen before round 1: test_queries.csv (questions, expected_traits, forbidden, reference),
  Judge model and prompt, pass rule, scoring rule checker, RAGAS thresholds, evaluation date 2026-11-25,
  and the weather record data; CSV SHA-256 and commit hash go into the round1 and round2 reports; only
  prompts, retrieval settings, generation logic, the hours parser and collected data may change between
  rounds; a scoring bug fix means round 1 is rescored with the same setup and the report says so'
- Case pass = 0 rule-check violations (checked first; a violation skips the Judge) AND every expected_traits
  item judged 예 AND every forbidden item 미검출 by an LLM Judge (Claude Sonnet 4.6, temperature 0, yes/no
  per item with a one-line reason); if a different model is unavailable, use Sonnet with a separate prompt
  and state the limitation in the README; expected_tools is a reference metric only
- 'RAGAS: 20-case averages, faithfulness ≥ 0.80, answer_relevancy ≥ 0.80, context_precision ≥ 0.70, context_recall
  ≥ 0.70; reported separately and not part of case pass'
- 'Targets: round 1 ≥ 70% (14/20), round 2 ≥ 85% (17/20), guardrail cases #18–#20 always 3/3; the case
  mix stays 8/4/5/3; failures on #16 (overseas) and #17 (add-on) are allowed if those NICE features are
  not built'
- 'Test #17 switches with the LIFEGALAXY_ADDON=on/off environment variable using data/demo_galaxy.json
  and must pass in both modes; test #5 swaps to indoor places as instructed, regardless of the forecast'
- The LifeGalaxy Node.js app is not modified; trip JSON v1 export (schemas/trip_v1.json, version='1',
  +09:00 local times, aligned with the trip-media format), plan import and photo matching (±30 min, 300
  m) are NICE add-ons active only when LIFEGALAXY_ADDON=on
- 'Home-address opt-in (NICE): entered only in a settings screen; geocoded once with VWorld, the raw address
  is discarded, coordinates are rounded to 3 decimals and stored locally and can be deleted; shown only
  as ''집'' to the LLM, trace and answer; a geocoding failure rejects registration; an OSRM failure or
  a delay over 5 s keeps the coordinates and uses the estimate plus a ''다시 계산'' button'
- The agent core (planning, rule checks, matching) is a Python package separate from FastAPI; the README
  includes a LifeGalaxy integration memo
- 'NICE priority: theme UI > overseas light mode > long-term memory > LifeGalaxy add-on > MCP (features
  are dropped in reverse order); no NICE work starts if round 1 is not done by Day 9 18:00; no new features
  after Day 10 10:00'
- 'Extended guardrails (apply even when unrelated to travel; code checks first, LLM second): (1) PII masking for resident/foreigner registration, passport, driver license, card (Luhn), account, phone, email, detailed address, car plate, birthdate+name — masked before the LLM, re-checked on output, and never stored in trace, logs, LangSmith, share page, .ics or memory; lookups of other people are refused; (2) prompt injection, direct (ignore-instructions, role-play, secret/system-prompt/env requests, encoded or multi-turn) and indirect (TourAPI/OSM/waypoint text is wrapped as data and never followed); off-topic tasks are refused; output is blocked if it contains system prompt text, key-like strings or .env key names; save_plan is not in the LLM tool list; (3) approval bypass: confirm only via action=approve + session_id + current draft_version; chat text or an action string inside the question never approves; a stale draft_version is refused; a second approve on an already confirmed session overwrites the same plan_id (stored plan, share page and .ics updated, link kept); other sessions cannot read or approve; invalid requests (empty or whitespace question, malformed JSON or field types, over 2,000 chars, unknown action, approve with unknown session_id) raise InvalidRequest, handled by a common exception handler that returns HTTP 400 (413 for length) with the standard body: answer in 모모''s voice saying the request was invalid and asking the user to try again, contexts [], trace [{step: error}], status 오류; no stack trace is exposed'
- 'Transport and route preview (MUST): conditions include transport (자차 or 대중교통), parsed from the question; if only transport is missing, default 자차 with ''기본값 적용'' and a UI toggle that recalculates; transit estimates: local walk if straight line <= 1.2 km (x1.3 / 4.5 km/h) else x1.3 / 15 km/h + 10 min wait, departure-to-region x1.3 / 60 km/h + 30 min; car keeps the existing rules; every leg shows ''약 N분'' with transport_mode car/walk/transit and an approximate-time notice; daily total travel time is shown and a leg over 60 min or travel longer than stays triggers a reorder/fewer-places suggestion; the Leaflet map shows per-day numbered markers, a dashed straight route line in visit order with per-leg time labels, day tabs, and marker-card linking (PC fixed right panel, mobile collapsible); domestic plans can switch between OSM and VWorld base/satellite tiles (VWORLD_API_KEY in .env); without a key or on tile errors the switch is hidden and OSM is used; road-following route geometry is NICE'
- 'Agent structure (C hybrid): one LangGraph graph; after the input guardrail a Pydantic intent router (plan / info / reject, ambiguous -> plan) sends plan requests to a fixed Plan-Execute subgraph (parse -> retrieve -> generate -> rule check with up to 2 regenerations -> output guardrail -> approval wait -> approve saves) and info questions to a ReAct node with the domain tools, followed by the output guardrail'
- References in test_queries.csv are drafted by Claude from the collected data, reviewed by the user,
  and frozen just before round 1
