- description: '[from-user]

    Decision: 권장 기본값 일괄 적용.

    1) 현지 종료 = min(20:00, 22:00−편도) 확정. 20:00이 기본, 22:00 귀가는 넘을 수 없는 상한. 기본 출발 08:00(사용자가 말하면 그 시각).

